services:
  postgres:
    image: postgres:17.7
    environment:
      POSTGRES_DB: dnd_combat_tracker
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or untracked .env file}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_combat_tracker"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
