name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test -DskipITs=true
      - name: Publish unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/*.xml
          if-no-files-found: error
      - name: Preserve unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-data
          path: target/jacoco.exec
          if-no-files-found: error

  integration-tests:
    name: Integration tests and coverage
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Download unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage-data
          path: target
      - name: Run integration tests and build application
        run: ./mvnw --batch-mode --no-transfer-progress verify -DskipUnitTests=true
      - name: Add coverage to job summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/site/jacoco/jacoco.csv ]]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 } END { total = missed + covered; printf "### Покрытие строк кода\n\n**%.2f%%** (%d из %d строк)\n", total ? covered * 100 / total : 0, covered, total }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Отчёт JaCoCo не создан.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publish integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/*.xml
          if-no-files-found: error
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: error
      - name: Preserve application artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error

  build-image:
    name: Publish dev image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified application
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build image and publish dev tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/oldgrot/dnd-combat-tracker:${{ github.sha }}
            ghcr.io/oldgrot/dnd-combat-tracker:dev-0.${{ github.run_number }}.${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report Flux deployment trigger
        shell: bash
        run: |
          echo '### Развёртывание dev' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Опубликован образ \`ghcr.io/oldgrot/dnd-combat-tracker:dev-0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}\`. Flux CD должен обнаружить новый тег и обновить стенд dev." >> "$GITHUB_STEP_SUMMARY"

  verify-dev-rollout:
    name: Verify dev rollout
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build-image
    # Requires a trusted runner with kubectl configured for this K3s cluster.
    # Never execute pull_request code on this runner.
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Wait for Flux to select this exact image
        shell: bash
        env:
          EXPECTED_IMAGE: ghcr.io/oldgrot/dnd-combat-tracker:dev-0.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          command -v kubectl
          kubectl auth can-i get deployment -n dev | grep -qx yes
          kubectl auth can-i watch deployment -n dev | grep -qx yes
          echo "Waiting for Flux CD to apply image: $EXPECTED_IMAGE"
          found=false
          for attempt in {1..60}; do
            current_image="$(kubectl -n dev get deployment dnd-combat-tracker -o jsonpath='{.spec.template.spec.containers[?(@.name=="app")].image}')"
            if [[ "$current_image" == "$EXPECTED_IMAGE" ]]; then
              found=true
              break
            fi
            echo "[$attempt/60] Current image: $current_image"
            sleep 10
          done
          if [[ "$found" != true ]]; then
            echo "::error::Flux did not apply the expected image within 10 minutes"
            exit 1
          fi

      - name: Wait for Kubernetes readiness
        shell: bash
        env:
          EXPECTED_IMAGE: ghcr.io/oldgrot/dnd-combat-tracker:dev-0.${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          kubectl -n dev rollout status deployment/dnd-combat-tracker --timeout=240s
          actual_image="$(kubectl -n dev get deployment dnd-combat-tracker -o jsonpath='{.spec.template.spec.containers[?(@.name=="app")].image}')"
          if [[ "$actual_image" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::Deployment image changed during rollout: $actual_image"
            exit 1
          fi
          echo "### Dev rollout verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$actual_image\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment ready according to Kubernetes readinessProbe." >> "$GITHUB_STEP_SUMMARY"
